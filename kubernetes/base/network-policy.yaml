# Deny all inbound traffic in the namespace, then open exactly three paths:
#   Envoy Gateway proxy -> api:8000
#   api, migrate        -> postgres:5432
# (Outbound is left open: pods need DNS and nothing else leaves the cluster.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-gateway
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: api }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
      ports:
        - { port: 8000, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-app
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["api", "migrate"]
      ports:
        - { port: 5432, protocol: TCP }
