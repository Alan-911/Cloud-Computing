# The API: three replicas behind a ClusterIP Service, reached through the Gateway.
#
# Zero-downtime rollouts come from four settings working together:
#   * maxUnavailable 0 / maxSurge 1: a new pod must be Ready before an old one stops
#   * readinessProbe on /api/health: a pod only gets traffic once it can reach the DB
#   * preStop sleep: an old pod keeps serving while endpoints and Envoy drop it
#   * uvicorn graceful shutdown on SIGTERM: in-flight requests finish
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: items
  labels: { app.kubernetes.io/name: api }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: items
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # appuser in the image
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: api }
      containers:
        - name: api
          image: ghcr.io/alan-911/cloud-computing:IMAGE_TAG
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: api-config }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD } }
            - name: APP_DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):5432/$(POSTGRES_DB)
            # Hashes of valid write keys (Secret created by scripts/k8s-up.sh).
            # Without it the API would reject every write (fail closed).
            - name: APP_API_KEY_HASHES
              valueFrom: { secretKeyRef: { name: api-auth, key: APP_API_KEY_HASHES } }
          startupProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "10"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi } # one Python process uses at most one core
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: items
  labels: { app.kubernetes.io/name: api }
spec:
  selector: { app.kubernetes.io/name: api }
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: items
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - name: api
          port: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: items
spec:
  minAvailable: 2 # node drains and upgrades keep at least two replicas serving
  selector:
    matchLabels: { app.kubernetes.io/name: api }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: items
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
