# Flood protection at the Gateway: Envoy's local rate limiter on the API route.
# Requests beyond the budget get 429 before they reach the API pods. The budget
# is per Envoy replica and sits well above normal traffic (including the CI
# zero-downtime test); nginx applies per-client limits in the Compose setup.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: api-rate-limit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: api
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 2000
            unit: Second
