apiVersion: v1
kind: Namespace
metadata:
  name: items
  labels:
    # Every pod must meet the "restricted" Pod Security Standard: non-root,
    # no privilege escalation, all capabilities dropped, seccomp RuntimeDefault.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    # Allows HTTPRoutes in this namespace to attach to the shared Gateway.
    gateway-access: "true"
