# Applies Alembic migrations before the API rolls out. scripts/k8s-up.sh (and the
# CI workflow) delete the previous Job, apply this one, and wait for it to complete
# before updating the Deployment, so new code never runs against an old schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: items
  labels: { app.kubernetes.io/name: migrate }
spec:
  backoffLimit: 6 # retries cover PostgreSQL still starting on a fresh cluster
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: items
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ghcr.io/alan-911/cloud-computing:IMAGE_TAG
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: api-config }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD } }
            - name: APP_DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):5432/$(POSTGRES_DB)
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
