# Local cluster: one control plane and two workers, so the API replicas spread
# across nodes and a rolling update moves pods between them.
#
#   kind create cluster --config kubernetes/cluster/kind.yaml
#
# The Envoy Gateway proxy is exposed as NodePort 30080 on the control-plane node and
# mapped to http://localhost:8088 (8088, not 80, so it coexists with Docker Compose).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: items
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8088
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
  - role: worker
