[project]
name = "cloud-native-items-api"
version = "1.3.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# A new warning is a failure, so deprecations are dealt with when they appear.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/academic-submission"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
