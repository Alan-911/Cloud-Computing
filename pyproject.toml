[project]
name = "cloud-native-items-api"
version = "1.2.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/academic-submission"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
