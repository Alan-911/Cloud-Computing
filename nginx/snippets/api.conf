# Shared by the HTTP and HTTPS server blocks.

location = / {
    default_type text/plain;
    return 200 "nginx ok\n";
}

# Proxy /api/* to the FastAPI service (service-name DNS). /metrics is deliberately
# not proxied: Prometheus scrapes it on the internal network.
location /api/ {
    limit_req  zone=per_ip        burst=600 nodelay;
    limit_req  zone=per_ip_writes burst=200 nodelay;
    limit_conn conn_per_ip 100;
    error_page 429 = @rate_limited;

    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

# Everything else (including /metrics) is not served.
location / {
    default_type application/json;
    return 404 '{"error":{"code":"not_found","message":"Not found.","details":null}}';
}

# Same error envelope as the API.
location @rate_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    add_header X-Request-ID $req_id always;
    return 429 '{"error":{"code":"rate_limited","message":"Too many requests; retry later.","details":null}}';
}
