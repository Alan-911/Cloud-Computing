worker_processes auto;
# Read-only root filesystem: the pid file and temp paths live on tmpfs mounts.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
    server_tokens off;   # no nginx version in headers or error pages

    # Request ID: keep the client's X-Request-ID if it sent one, otherwise use
    # nginx's own random $request_id. The same value goes to the API and to the
    # access log, so one ID ties the proxy log line to the application's lines.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # One JSON object per line, like the application logs.
    log_format json escape=json
        '{"timestamp":"$time_iso8601","logger":"nginx.access",'
        '"request_id":"$req_id","client_ip":"$remote_addr",'
        '"http_method":"$request_method","http_path":"$uri","http_status":$status,'
        '"bytes_sent":$body_bytes_sent,"duration_ms":$request_time,'
        '"upstream_ms":"$upstream_response_time","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    # Request limits: the API takes small JSON bodies; slow clients are cut off.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    # Rate limits per client IP (see snippets/api.conf for where they apply).
    # Writes get their own, tighter budget; reads leave the write key empty, and an
    # empty key is not counted.
    map $request_method $write_limit_key {
        GET     "";
        HEAD    "";
        OPTIONS "";
        default $binary_remote_addr;
    }
    limit_req_zone  $binary_remote_addr zone=per_ip:10m        rate=300r/s;
    limit_req_zone  $write_limit_key    zone=per_ip_writes:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # Temp paths on tmpfs (read-only root filesystem).
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
