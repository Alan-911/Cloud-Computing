events {}

http {
    # Request ID: keep the client's X-Request-ID if it sent one, otherwise use
    # nginx's own random $request_id. The same value is passed to the API (which
    # echoes it and logs it) and written to the access log below, so one ID ties
    # the proxy log line to the application's log lines.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # One JSON object per line, like the application logs.
    log_format json escape=json
        '{"timestamp":"$time_iso8601","logger":"nginx.access",'
        '"request_id":"$req_id","client_ip":"$remote_addr",'
        '"http_method":"$request_method","http_path":"$uri","http_status":$status,'
        '"bytes_sent":$body_bytes_sent,"duration_ms":$request_time,'
        '"upstream_ms":"$upstream_response_time","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    server {
        listen 80;

        # Basic sanity endpoint at /
        location / {
            default_type text/plain;
            return 200 "nginx ok\n";
        }

        # Proxy /api/* to the FastAPI service (service-name DNS). /metrics is
        # deliberately not proxied: Prometheus scrapes it on the internal network.
        location /api/ {
            proxy_pass http://api:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;

            proxy_http_version 1.1;
            proxy_buffering off;
        }
    }
}
