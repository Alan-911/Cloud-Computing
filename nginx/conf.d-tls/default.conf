# HTTPS: port 80 only redirects; port 443 serves the API with TLS 1.2/1.3.
# Certificates come from scripts/dev-cert.sh (local) or a real CA (see
# docs/security/README.md).
server {
    listen 80;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Mozilla "intermediate" profile: TLS 1.2 and 1.3, forward-secret AEAD ciphers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    # Browsers remember to use HTTPS only. (No includeSubDomains/preload: this is a
    # local development certificate.)
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/api.conf;
}
