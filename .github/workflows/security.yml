name: Security

# Dependency, image, secret and configuration scanning. Runs on every change and
# weekly, because new vulnerabilities appear in code that has not changed.
# Findings go to the repository's Security tab (code scanning).
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Python dependencies (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: app/requirements.txt requirements-dev.txt

  repository:
    name: Secrets and misconfiguration (Trivy fs)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Scan (report to Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: docs/academic-submission
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-fs.sarif') != ''
        continue-on-error: true # not available on pull requests from forks
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Fail on secrets or critical/high findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: docs/academic-submission
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  image:
    name: Container image (Trivy image)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: app/Dockerfile
          tags: items-api:scan
          load: true
          cache-from: type=gha
      - name: Scan (report to Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: items-api:scan
          format: sarif
          output: trivy-image.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-image.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Fail on fixable critical/high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: items-api:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
