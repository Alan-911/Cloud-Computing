name: Deploy

# Manual deploy of an already-published image to the Terraform-managed EC2 host.
# Pick the branch or tag in "Use workflow from"; the image built from that exact
# commit (sha-<short>) is deployed, with the Compose files from the same commit.
# To roll back, run this workflow again from the earlier commit or tag.
#
# No SSH and no stored AWS keys: the job gets short-lived credentials through
# GitHub OIDC for a role that can only run commands on the app instance via
# AWS Systems Manager, and only from the `production` environment.
#
# Setup (once), in Settings -> Environments -> production -> variables, using the
# outputs of infrastructure/terraform/app:
#   AWS_DEPLOY_ROLE_ARN  (deploy_role_arn)
#   EC2_INSTANCE_ID      (instance_id)
#   APP_URL              (app_url)
#   AWS_REGION           (optional, default us-east-1)
# Optionally add required reviewers so every deploy needs approval.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for AWS

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      IMAGE: ghcr.io/alan-911/cloud-computing
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Check configuration
        run: |
          missing=()
          [ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] || missing+=(AWS_DEPLOY_ROLE_ARN)
          [ -n "$INSTANCE_ID" ] || missing+=(EC2_INSTANCE_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing production environment variables: ${missing[*]}"; exit 1
          fi
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: The image for this commit exists (built and tested by Release)
        run: |
          docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" > /dev/null || {
            echo "::error::${IMAGE}:${IMAGE_TAG} not found. Wait for the Release workflow on this commit."
            exit 1
          }

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}

      - name: Deploy on the host (SSM Run Command)
        run: |
          set -euo pipefail
          script="set -euo pipefail
          cd /opt/cloud-computing
          git fetch --quiet --tags origin
          git checkout --quiet --detach ${GITHUB_SHA}
          IMAGE_TAG=${IMAGE_TAG} bash scripts/deploy-on-host.sh"

          params=$(jq -n --arg s "$script" '{commands: [$s], executionTimeout: ["900"]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${IMAGE_TAG} from run ${GITHUB_RUN_ID}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          status=Pending
          for _ in $(seq 1 90); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Final status: $status"
          [ "$status" = "Success" ]

      - name: Public health check
        if: vars.APP_URL != ''
        run: |
          body=$(curl -fsS -m 10 "${{ vars.APP_URL }}/api/health")
          echo "$body"
          echo "Deployed \`${IMAGE}:${IMAGE_TAG}\` — health: \`$body\`" >> "$GITHUB_STEP_SUMMARY"
