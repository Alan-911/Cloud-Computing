# Requires a .env file with POSTGRES_PASSWORD and APP_API_KEY_HASHES (copy
# .env.example; generate a key with scripts/new-api-key.sh).
#
# Start order: db (healthy) -> migrate (runs `alembic upgrade head`, exits 0)
#              -> api (healthy) -> nginx.
#
# Hardening: every container drops privilege escalation; the app containers and
# nginx also drop all Linux capabilities and run with a read-only root filesystem.

x-api-environment: &api-environment
  APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-app}
  # Hashes only; with none set, production rejects every write (fail closed).
  APP_API_KEY_HASHES: ${APP_API_KEY_HASHES:-}

x-app-hardening: &app-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=16m

services:
  db:
    image: postgres:17-alpine
    container_name: items_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published: reachable only by services on the compose network.
    expose:
      - "5432"
    # The entrypoint starts as root and drops to the postgres user, so it keeps its
    # default capabilities; no-new-privileges still blocks setuid escalation.
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app-hardening
    build:
      context: .
      dockerfile: app/Dockerfile
    image: items-api:local
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-hardening
    image: items-api:local
    container_name: items_api
    environment: *api-environment
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    container_name: items_nginx
    depends_on:
      api:
        condition: service_healthy
    # Only the proxy is published to the host.
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    read_only: true
    cap_drop: [ALL]
    # Back only what the official image needs: bind 80/443, switch the workers to the
    # nginx user, and chown its temp directories on the tmpfs.
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=16m
    restart: unless-stopped

volumes:
  pgdata:
