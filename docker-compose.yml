# Requires a .env file with POSTGRES_PASSWORD (copy .env.example).
#
# Start order: db (healthy) -> migrate (runs `alembic upgrade head`, exits 0)
#              -> api (healthy) -> nginx.

x-api-environment: &api-environment
  APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-app}

services:
  db:
    image: postgres:17-alpine
    container_name: items_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published: reachable only by services on the compose network.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: items-api:local
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: items-api:local
    container_name: items_api
    environment: *api-environment
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    container_name: items_nginx
    depends_on:
      api:
        condition: service_healthy
    # Only the proxy is published to the host.
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
